services:
  app:
    # Built from source on purpose: this fork carries its own changes (German
    # invoice template, cash discount fields) that the upstream prebuilt image
    # at ghcr.io/pigontech/inkvoice does not contain.
    build: .
    # Dokploy/Traefik reaches the app through Docker's internal network.
    # Publishing 3000 on the host conflicts with Dokploy's own web interface.
    expose:
      - "3000"
    volumes:
      - inkvoice-data:/app/data
    environment:
      # Left empty so the app owns the defaults (admin/changeme, or demo/demo
      # when DEMO_MODE=true). Set them in .env to override.
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASS: ${ADMIN_PASS:-}
      # Required. No fallback on purpose: a shipped default secret would be
      # public knowledge. Generate one with: openssl rand -base64 48
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env, minimum 32 characters}
      DATABASE_PATH: /app/data/invoice.db
      PORT: "3000"
      HOST: 0.0.0.0
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_RESET_INTERVAL: ${DEMO_RESET_INTERVAL:-86400000}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      PEPPOL_SH_API_KEY: ${PEPPOL_SH_API_KEY:-}
      PEPPOL_SH_WEBHOOK_SECRET: ${PEPPOL_SH_WEBHOOK_SECRET:-}
      PEPPOL_SH_BASE_URL: ${PEPPOL_SH_BASE_URL:-https://api.peppol.sh}
      # Payment gateways. Both stay dormant until their credentials are present
      # AND the gateway is toggled on in Settings, so leaving these empty is safe.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_SECRET: ${PAYPAL_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}
    restart: unless-stopped
    # Bun sizes its heap to the memory it can see - keep this cap.
    mem_limit: 512m

volumes:
  inkvoice-data:
